services:
  - type: web
    name: kayniou-liggey-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: kayniou-liggey-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 30d
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
